# One grouped update a week, a week old at the least (ADR-0019 decision 3).
# Nothing merges by itself. A major version, and any tsdown 0.x minor, needs its own ADR (decision 4).
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release younger than this is not proposed. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ['*']
        # Pre-1.0: a minor can change the build, so each update arrives alone.
        exclude-patterns: ['tsdown']
        update-types: [minor, patch]
    ignore:
      # Moves by hand, together with the Bun version in .github/workflows/ci.yml.
      - dependency-name: '@types/bun'
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
