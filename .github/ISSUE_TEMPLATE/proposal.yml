name: Proposal
description: A new function, option or domain, or a change to how an existing one behaves.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        Every feature and functional change here starts with an ADR that the owner approves before anything is built (ADR-0001). This issue is where that conversation starts; please do not open a pull request with the code first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who has it, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The call you would like to write, and the exact output you expect from it.
      placeholder: toNepaliWords(1.5) returns "एक दशमलव पाँच"
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Other options you considered
  - type: checkboxes
    id: invariants
    attributes:
      label: The package's rules
      options:
        - label: It needs no runtime dependency and no browser or Node.js global.
          required: true
